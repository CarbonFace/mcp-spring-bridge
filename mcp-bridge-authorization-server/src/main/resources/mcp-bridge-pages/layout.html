<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}">MCP Connection</title>
<style>body{margin:0;background:#f4f6fa;color:#162536;font:16px/1.6 system-ui,sans-serif}main{max-width:520px;margin:7vh auto;padding:32px;background:white;border:1px solid #dde3eb;border-radius:18px;box-shadow:0 12px 40px #152b4710}h1{font-size:26px;line-height:1.25;margin:8px 0 20px}h2{font-size:19px}.brand{color:#52647a;font-weight:650;letter-spacing:.03em}label{display:block;margin-top:18px}input:not([type=checkbox]){display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #9baabd;border-radius:8px}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}button{font:inherit;font-weight:650;padding:11px 18px;border:1px solid #1649a3;background:#1649a3;color:white;border-radius:9px;cursor:pointer;margin:20px 8px 0 0}.secondary{background:white;color:#1649a3}.message{background:#fff5dc;padding:12px;border-radius:8px}.muted{color:#52647a;font-size:14px}.grant{padding:16px 0;border-top:1px solid #dde3eb}p,li,code{overflow-wrap:anywhere}a{color:#1649a3}a:focus,button:focus,input:focus{outline:3px solid #75a5f5;outline-offset:3px}@media(max-width:600px){main{margin:20px 12px;padding:24px 20px}} </style>
</head></html>
